{# A ladder's numbers: `v` holds what the fields show (empty for a new ladder, which shows the TER
   example as placeholders), `action` where they go, `button` what saving is called. #}
<form method="post" action="{{ action }}" class="ladder-form" autocomplete="off">
  <fieldset class="ladder-fields">
    <legend>The shares</legend>
    <label for="{{ prefix }}-symbol">Ticker
      <input type="text" id="{{ prefix }}-symbol" name="symbol" required maxlength="10"
             value="{{ v.symbol|default('') }}" placeholder="TER" spellcheck="false"></label>
    <label for="{{ prefix }}-shares">Shares
      <input type="text" id="{{ prefix }}-shares" name="shares" required inputmode="numeric"
             value="{{ v.shares|default('') }}" placeholder="100"></label>
    <label for="{{ prefix }}-cost">Cost, $/share <small>the put strike you were assigned at</small>
      <input type="text" id="{{ prefix }}-cost" name="cost" required inputmode="decimal"
             value="{{ v.cost|default('') }}" placeholder="390"></label>
    <label for="{{ prefix }}-put">Put premium, $/share
      <input type="text" id="{{ prefix }}-put" name="put_premium" inputmode="decimal"
             value="{{ v.put_premium|default('') }}" placeholder="0"></label>
    <label for="{{ prefix }}-calls">Call premiums, $/share <small>every call so far, the open one
        included, less what buying any back cost</small>
      <input type="text" id="{{ prefix }}-calls" name="call_premiums" inputmode="decimal"
             value="{{ v.call_premiums|default('') }}" placeholder="6.00"></label>
    <label for="{{ prefix }}-rungs" class="ladder-wide">Rungs <small>the strikes the call steps up;
        the last is the target</small>
      <input type="text" id="{{ prefix }}-rungs" name="rungs" required
             value="{{ v.rungs|default('') }}" placeholder="340, 355, 370, 390"></label>
  </fieldset>
  <fieldset class="ladder-fields">
    <legend>The call open now <small>leave empty if none is</small></legend>
    <label for="{{ prefix }}-strike">Strike
      <input type="text" id="{{ prefix }}-strike" name="call_strike" inputmode="decimal"
             value="{{ v.call_strike|default('') }}" placeholder="340"></label>
    <label for="{{ prefix }}-expiry">Expiry
      <input type="date" id="{{ prefix }}-expiry" name="call_expiry"
             value="{{ v.call_expiry|default('') }}"></label>
    <label for="{{ prefix }}-sold">Sold for, $/share
      <input type="text" id="{{ prefix }}-sold" name="call_sold_for" inputmode="decimal"
             value="{{ v.call_sold_for|default('') }}" placeholder="6.00"></label>
  </fieldset>
  <button type="submit" class="secondary">{{ button }}</button>
</form>
