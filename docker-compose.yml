# Production stack for steadybull.net: the app behind Caddy (auto-TLS reverse proxy).
# Secrets (AUTH__PASSWORD, ALPACA__*, FMP__API_KEY) come from a host .env — see docs/DEPLOY.md.
services:
  app:
    build: .
    image: wheel-screener:latest
    restart: unless-stopped
    # bound the app so a runaway (OOM) can't take the whole 2GB box (and Caddy) down with it —
    # it gets killed + restarted (unless-stopped has backoff) while Caddy stays up. Generous enough
    # for the normal ~512MB + a refresh-screen exec double-load; swap (memswap default 2x) backs it.
    mem_limit: 1700m
    env_file: .env # secrets: AUTH__PASSWORD, ALPACA__API_KEY/API_SECRET, FMP__API_KEY, ...
    environment:
      # production posture (override anything from .env)
      CHAIN_SOURCE: alpaca # key/secret, no OAuth — the prod chain source
      # No HTTP Basic-Auth password. The screener is public on purpose, and the Portfolio is
      # behind a passkey sign-in (v3.3.0) — including the broker connect/callback routes, which
      # v3.0.0 had to put a password in front of because they were the way in. The password gate
      # still exists (AUTH__SCOPE) but is switched off: it was the browser's grey pop-up, and it
      # offered no way in if passkeys ever failed. .env still holds AUTH__PASSWORD, so it is
      # blanked here explicitly; REQUIRED=false stops the app refusing to start without one.
      AUTH__REQUIRED: "false"
      AUTH__PASSWORD: ""
      # runtime paths -> the mounted volume
      DATA_DIR: /data/fundamentals
      EARNINGS_PATH: /data/earnings_calendar.csv
      JOBS_DB_PATH: /data/jobs.sqlite
      LOG__DIR: /data/logs
      # Portfolio state MUST live on the volume. Both default to paths inside the container, and
      # a deploy replaces the container — so leaving them would sign every session out and destroy
      # the broker link on each release, looking like "Schwab keeps disconnecting".
      # Where Schwab sends the browser back. It defaults to a LOOPBACK address for the CLI's
      # local login, which is always wrong for the web flow — Schwab would redirect the visitor
      # to their own machine with the authorization code attached. Set here, not in .env, so a
      # deploy cannot inherit the default.
      SCHWAB__CALLBACK_URL: https://steadybull.net/portfolio/oauth/schwab/callback
      PORTFOLIO__SESSIONS_DB_PATH: /data/sessions.sqlite
      # Passkeys are bound to the hostname and the browser reports the exact origin on every
      # sign-in; both are checked. The defaults are for local development (localhost), so they are
      # set here rather than in .env — a deploy that inherited them would refuse every passkey.
      # These also make `wheel-screener invite` print links for the right site.
      PASSKEYS__RP_ID: steadybull.net
      PASSKEYS__ORIGIN: https://steadybull.net
      SCHWAB__TOKEN_PATH: /data/links/schwab_token.json
    volumes:
      # host ./data holds the slim store (fundamentals/), jobs DB, logs.
      # the container runs as uid 10001 — `sudo chown -R 10001:10001 ./data` first (see DEPLOY.md).
      - ./data:/data
    expose:
      - "8000" # internal only; reachable by Caddy, never published to the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # ACME certs (persist so re-deploys don't re-issue)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
